<!-- STREAMING_CHUNK: Setting up luxury document head with deep blue and gold design tokens... -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation de Mariage - Eric & Prescillia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { font-family: 'Montserrat', sans-serif; }
        h1, h2, h3, .serif { font-family: 'Playfair Display', serif; }
        
        @keyframes subtle-zoom { 
            0% { transform: scale(1); } 
            100% { transform: scale(1.03); } 
        }
        .animate-subtle-zoom { animation: subtle-zoom 15s infinite alternate ease-in-out; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .fade-in { animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Ombre douce pour le carton blanc d'art */
        .blue-shadow-soft {
            box-shadow: 0 10px 30px -10px rgba(2, 2, 40, 0.15), inset 0 0 15px rgba(2, 2, 40, 0.02);
        }
    </style>
</head>
<body class="bg-stone-100 text-[#020228] antialiased">

    <!-- STREAMING_CHUNK: Initializing HTML core containers... -->
    <div id="app" class="min-h-screen flex justify-center items-center p-0 sm:p-4 bg-gradient-to-br from-stone-100 to-stone-200">
        <!-- Le conteneur s'adapte dynamiquement avec une transition de couleur -->
        <div class="max-w-md w-full bg-[#020228] shadow-2xl sm:rounded-2xl overflow-hidden relative min-h-screen sm:min-h-[85vh] flex flex-col transition-colors duration-500" id="main-container">
        </div>
    </div>

    <script>
        /* STREAMING_CHUNK: Declaring updated wedding dataset for Exodus DGC... */
        const weddingData = {
            groom: "Eric",
            bride: "Prescillia",
            date: "05 Septembre 2026",
            time: "20h30",
            location: "Salle de fête EXODUS",
            address: "Commune : Ngaliema (Quartier DGC), Réf : hôpital de voici l'homme, non loin de l'arrêt DGC.",
            mapUrl: "https://maps.google.com/?q=Salle+Exodus+DGC+Ngaliema+Kinshasa"
        };

        const params = new URLSearchParams(window.location.search);
        const guestInfo = {
            name: params.get('guest') || 'Cher Invité',
            table: params.get('table') || 'Honneur'
        };

        function setView(viewName) {
            render(viewName);
        }

        /* STREAMING_CHUNK: Designing core navigation and premium tab layouts... */
        function render(view) {
            const container = document.getElementById('main-container');
            if (!container) return;
            
            if (view === 'envelope') {
                // Première page (Enveloppe) : Fond bleu nuit profond assorti à image_bf6dd8.png
                container.className = "max-w-md w-full bg-[#020228] shadow-2xl sm:rounded-2xl overflow-hidden relative min-h-screen sm:min-h-[85vh] flex flex-col border border-amber-500/15";
                
                container.innerHTML = `
                    <div class="absolute inset-0 z-50 bg-[#020228] flex flex-col items-center justify-between p-8 cursor-pointer fade-in shadow-2xl relative overflow-hidden select-none" onclick="setView('invitation')">
                        
                        <!-- Splendide halo de lumière central arrière -->
                        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 rounded-full bg-emerald-500/10 blur-[100px] pointer-events-none"></div>

                        <!-- Cadre intérieur élégant en liseré or -->
                        <div class="absolute inset-4 border border-amber-500/20 pointer-events-none rounded-xl"></div>
                        <div class="absolute inset-[19px] border-2 border-double border-amber-500/10 pointer-events-none rounded-lg"></div>
                        
                        <!-- Ornements botaniques d'angle or en SVG -->
                        <div class="absolute top-6 left-6 text-amber-500/20 pointer-events-none w-16 h-16">
                            <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M10,90 Q10,10 90,10 M10,10 L30,30 M10,10 Q25,5 35,15 M10,10 Q5,25 15,35 M20,20 Q40,15 45,30 M20,20 Q15,40 30,45" />
                            </svg>
                        </div>
                        <div class="absolute top-6 right-6 text-amber-500/20 pointer-events-none w-16 h-16 rotate-90">
                            <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M10,90 Q10,10 90,10 M10,10 L30,30 M10,10 Q25,5 35,15 M10,10 Q5,25 15,35 M20,20 Q40,15 45,30 M20,20 Q15,40 30,45" />
                            </svg>
                        </div>
                        <div class="absolute bottom-6 left-6 text-amber-500/20 pointer-events-none w-16 h-16 -rotate-90">
                            <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M10,90 Q10,10 90,10 M10,10 L30,30 M10,10 Q25,5 35,15 M10,10 Q5,25 15,35 M20,20 Q40,15 45,30 M20,20 Q15,40 30,45" />
                            </svg>
                        </div>
                        <div class="absolute bottom-6 right-6 text-amber-500/20 pointer-events-none w-16 h-16 rotate-180">
                            <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M10,90 Q10,10 90,10 M10,10 L30,30 M10,10 Q25,5 35,15 M10,10 Q5,25 15,35 M20,20 Q40,15 45,30 M20,20 Q15,40 30,45" />
                            </svg>
                        </div>

                        <!-- Cordon doré décoratif haut -->
                        <div class="w-full flex justify-center pt-8 z-10">
                            <div class="h-[2px] w-12 bg-gradient-to-r from-transparent via-amber-500/40 to-transparent"></div>
                        </div>
                        
                        <!-- Cœur textuel de l'invitation d'honneur -->
                        <div class="text-center space-y-6 my-auto max-w-[320px] z-10 px-2">
                            <p class="text-amber-400 uppercase tracking-[0.35em] text-[10px] font-semibold drop-shadow-sm">INVITATION </p>
                            
                            <!-- Noms des Mariés en Or chaud -->
                            <h3 class="text-2xl text-amber-300 uppercase tracking-[0.15em] font-light serif leading-snug drop-shadow-sm">
                                ${weddingData.groom} 
                                <span class="serif italic text-amber-400/90 lowercase text-3xl block my-1">&</span> 
                                ${weddingData.bride}
                            </h3>
                            
                            <div class="w-12 h-px bg-gradient-to-r from-transparent via-amber-400/30 to-transparent mx-auto"></div>
                            
                            <p class="text-emerald-100/70 text-xs italic font-light leading-relaxed px-4">
                                "Nous sommes heureux de vous annoncer notre mariage et ce serait vraiment un bonheur pour nous de vous compter parmi nos invités ce jour-là"
                            </p>
                            
                            <!-- Invité en Blanc Pur -->
                            <div class="py-4 space-y-1">
                                <p class="text-amber-500/60 italic text-[12px]">Invitation personnelle pour</p>
                                <h2 class="text-3xl font-light text-white serif tracking-wide drop-shadow-md">${guestInfo.name}</h2>
                            </div>
                        </div>
                        
                        <!-- Sceau royal de cire d'or tactile -->
                        <div class="flex flex-col items-center space-y-4 pb-8 z-10">
                            <div class="relative flex items-center justify-center">
                                <!-- Ondes lumineuses de vibration -->
                                <span class="absolute inline-flex h-20 w-20 rounded-full bg-amber-500/10 animate-ping"></span>
                                
                                <!-- Sceau de cire métallique 3D Premium -->
                                <div class="w-16 h-16 bg-gradient-to-br from-amber-200 via-amber-500 to-amber-700 rounded-full flex items-center justify-center shadow-[0_10px_25px_-5px_rgba(217,119,6,0.5),_inset_0_2px_4px_rgba(255,255,255,0.6)] border-2 border-amber-300/40 transition-transform duration-300 hover:scale-110 active:scale-95">
                                    <div class="w-12 h-12 rounded-full border border-dashed border-amber-200/50 flex items-center justify-center">
                                        <span class="text-stone-900 font-bold tracking-tight text-base serif drop-shadow">${weddingData.groom[0]}&${weddingData.bride[0]}</span>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="flex items-center gap-2 text-amber-400/70 text-[9px] uppercase tracking-[0.3em] font-semibold">
                                <span>Toucher pour Ouvrir</span>
                                <i data-lucide="chevron-down" class="w-3.5 h-3.5 animate-bounce text-amber-400"></i>
                            </div>
                        </div>
                    </div>
                `;
            } 
            else if (view === 'invitation') {
                // Deuxième page (Invitation) : Fond blanc d'art (ivoire) doux, sans barre d'onglets au bas
                container.className = "max-w-md w-full bg-[#FAF9F5] shadow-2xl sm:rounded-2xl overflow-hidden relative min-h-screen sm:min-h-[85vh] flex flex-col border border-stone-200/40";
                
                container.innerHTML = `
                    <div class="flex-1 overflow-y-auto no-scrollbar scroll-smooth bg-[#FAF9F5] pb-12">
                        <!-- En-tête photo de mariage -->
                        <div class="relative h-[38vh] flex items-end justify-center pb-8 overflow-hidden shadow-sm">
                            <!-- Dégradé doux ivoire sur la photo -->
                            <div class="absolute inset-0 bg-gradient-to-b from-stone-950/20 via-transparent to-[#FAF9F5] z-10"></div>
                            <div class="absolute inset-0 bg-[url('ma-photo.jpg')] bg-cover bg-center scale-105 animate-subtle-zoom"></div>
                            
                            <div class="relative z-20 text-center px-4 space-y-2.5">
                                <h1 class="text-4xl font-light text-stone-900 tracking-wide">${weddingData.groom} <span class="text-2xl font-serif italic text-[#020228]">&</span> ${weddingData.bride}</h1>
                                <div class="inline-block bg-white/95 px-5 py-1 rounded-full border border-amber-600/15 shadow-sm">
                                    <p class="uppercase tracking-[0.3em] text-[#020228] text-[9px] font-semibold">${weddingData.date}</p>
                                </div>
                            </div>
                        </div>

                        <!-- Contenu principal : Une seule page continue -->
                        <div class="p-6 text-center space-y-6 relative">
                            
                            <!-- Carton de mariage blanc d'art avec bordures bleu foncé royal -->
                            <article class="bg-white p-6 rounded-2xl border-2 border-double border-[#020228]/25 shadow-md relative overflow-hidden blue-shadow-soft space-y-6 text-center">
                                
                                <!-- Ornements d'angle bleu foncé fins -->
                                <div class="absolute top-2.5 left-2.5 text-[#020228]/20 pointer-events-none w-6 h-6">
                                    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5,45 V5 H45"/></svg>
                                </div>
                                <div class="absolute top-2.5 right-2.5 text-[#020228]/20 pointer-events-none w-6 h-6 rotate-90">
                                    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5,45 V5 H45"/></svg>
                                </div>
                                <div class="absolute bottom-2.5 left-2.5 text-[#020228]/20 pointer-events-none w-6 h-6 -rotate-90">
                                    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5,45 V5 H45"/></svg>
                                </div>
                                <div class="absolute bottom-2.5 right-2.5 text-[#020228]/20 pointer-events-none w-6 h-6 rotate-180">
                                    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5,45 V5 H45"/></svg>
                                </div>

                                <!-- Invitation nominative d'honneur -->
                                <div class="space-y-1">
                                    <p class="text-[9px] uppercase tracking-[0.3em] text-[#020228]/60 font-semibold">Invitation Personnelle</p>
                                    <h3 class="text-2xl font-light text-[#020228] serif tracking-wide pt-1">${guestInfo.name}</h3>
                                    
                                    <div class="pt-2">
                                        <span class="inline-flex items-center gap-1.5 bg-[#020228]/5 px-3.5 py-1 rounded-full border border-[#020228]/15 text-[#020228] text-[9px] font-semibold tracking-[0.15em] uppercase">
                                            <i data-lucide="armchair" class="w-3 h-3"></i>
                                            Table : ${guestInfo.table}
                                        </span>
                                    </div>
                                </div>

                                <!-- Séparateur botanique fin en bleu foncé -->
                                <div class="flex justify-center items-center gap-3">
                                    <div class="h-px w-10 bg-[#020228]/15"></div>
                                    <svg class="w-3.5 h-3.5 text-[#020228]/40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                        <path d="M12 3v18M12 3a9 9 0 0 1 9 9M12 21a9 9 0 0 0-9-9" />
                                    </svg>
                                    <div class="h-px w-10 bg-[#020228]/15"></div>
                                </div>

                                <!-- Programme & Date de l'événement -->
                                <div class="space-y-4">
                                    <div class="space-y-1">
                                        <p class="text-[9px] uppercase tracking-[0.25em] text-stone-400 font-medium">Célébration le</p>
                                        <p class="text-[#020228] text-2xl font-light serif tracking-widest uppercase">${weddingData.date}</p>
                                    </div>

                                    <!-- Carton "Soirée Dansante" au fini haute couture -->
                                    <div class="relative bg-gradient-to-br from-white to-[#FAF9F5] p-6 rounded-2xl border border-amber-500/15 max-w-[280px] mx-auto space-y-3.5 shadow-[0_8px_25px_-5px_rgba(2,2,40,0.04)] hover:shadow-[0_12px_30px_-5px_rgba(2,2,40,0.08)] transition-all duration-300">
                                        <!-- Petits ornements d'en-tête or -->
                                        <div class="flex items-center justify-center gap-2">
                                            <span class="h-px w-6 bg-gradient-to-r from-transparent to-amber-500/20"></span>
                                            <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-600/60 animate-pulse"></i>
                                            <span class="h-px w-6 bg-gradient-to-l from-transparent to-amber-500/20"></span>
                                        </div>

                                        <div class="space-y-2">
                                            <!-- Badge Heure Premium -->
                                            <span class="text-[10px] font-bold text-white bg-[#020228] px-4 py-1 rounded-full tracking-[0.25em] uppercase inline-block border border-amber-500/20 shadow-sm">${weddingData.time}</span>
                                            <h4 class="text-lg font-semibold text-[#020228] serif tracking-wide pt-1.5">Soirée Dansante</h4>
                                        </div>
                                        
                                        <p class="text-xs text-stone-500 font-light leading-relaxed px-1">Dîner de prestige, ouverture du bal et festivités</p>
                                        
                                        <!-- Ligne décorative basse -->
                                        <div class="w-10 h-[2px] bg-gradient-to-r from-transparent via-amber-500/30 to-transparent mx-auto"></div>
                                    </div>
                                </div>

                                <!-- Séparateur botanique fin -->
                                <div class="flex justify-center items-center gap-3">
                                    <div class="h-px w-10 bg-[#020228]/15"></div>
                                    <svg class="w-3.5 h-3.5 text-[#020228]/40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                        <path d="M12 3v18M12 3a9 9 0 0 1 9 9M12 21a9 9 0 0 0-9-9" />
                                    </svg>
                                    <div class="h-px w-10 bg-[#020228]/15"></div>
                                </div>

                                <!-- Lieu de réception élégant avec intégration du bouton Google Maps -->
                                <div class="space-y-4 px-2">
                                    <div class="space-y-1.5">
                                        <div class="flex items-center justify-center gap-1.5 text-[#020228]">
                                            <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
                                            <p class="text-xs font-semibold uppercase tracking-widest serif">${weddingData.location}</p>
                                        </div>
                                        <p class="text-[11px] text-stone-500 font-light leading-relaxed max-w-[260px] mx-auto">${weddingData.address}</p>
                                    </div>
                                    
                                    <!-- Le bouton Google Maps intégré ici de manière magistrale -->
                                    <div class="pt-2">
                                        <a href="${weddingData.mapUrl}" target="_blank" rel="noopener noreferrer" 
                                           class="inline-flex items-center gap-2 bg-[#020228] text-white px-6 py-3 rounded-xl text-[10px] uppercase tracking-[0.2em] font-medium shadow-md hover:opacity-95 transition-all hover:scale-105 active:scale-95">
                                            <i data-lucide="navigation" class="w-4 h-4 text-white animate-pulse"></i>
                                            Ouvrir Google Maps
                                        </a>
                                    </div>
                                </div>

                            </article>

                            <footer class="pt-10 pb-4 text-stone-400 text-[9px] uppercase tracking-[0.35em] border-t border-stone-200/40 mt-12">
                                <p class="mb-4 text-stone-500 font-serif italic normal-case tracking-normal text-base">Nous serions particulièrement honorés de vous compter parmi nous.</p>
                                <div class="font-semibold text-[#020228] tracking-[0.2em] mt-6">${weddingData.groom} & ${weddingData.bride}</div>
                            </footer>
                        </div>
                    </div>
                `;
            }
            lucide.createIcons();
        }

        window.onload = () => render('envelope');
    </script>
</body>
</html>
